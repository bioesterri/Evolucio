[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "projecte-evolucio"
version = "0.1.0.dev0"
description = "A reproducible and scientifically auditable evolutionary artificial life prototype."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "equinox>=0.13,<0.14",
    "jax>=0.7,<0.8",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
persistence = [
    "mlflow>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=20,<22",
    "sqlalchemy>=2.0,<3",
    "zarr>=3.0,<4",
]
analysis = [
    "polars>=1.31,<2",
    "pyarrow>=20,<22",
]
visualization = [
    "imageio>=2.37,<3",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = [
    "coverage>=7.9,<8",
    "hypothesis>=6.135,<7",
    "import-linter>=2.3,<3",
    "pyright>=1.1.402,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evolucio"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/evolucio"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["evolucio"]
branch = true
relative_files = true
omit = [
    "*/.venv/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.importlinter]
root_package = "evolucio"
exclude_type_checking_imports = true
